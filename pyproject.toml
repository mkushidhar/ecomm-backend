[project]
name = "ecomm-backend"
version = "0.1.0"
description = "Backend for E-commerce application"
readme = "README.md"
authors = [
    { name = "mkushidhar", email = "kushidhar.modugu@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "asyncmy>=0.2.14",
    "cryptography>=50.0.0",
    "fastapi>=0.141.1",
    "fastapi-cli>=0.0.32",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
]

[tool.fastapi]
entrypoint = "ecomm.main:app"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes (unused imports/vars, undefined names)
    "I",      # isort (import sorting)
    "UP",     # pyupgrade (modernize syntax for your target version)
    "B",      # flake8-bugbear (common bug patterns)
    "SIM",    # flake8-simplify (simpler equivalent code)
    "ASYNC",  # flake8-async (async/await misuse — relevant since FastAPI is async-first)
    "FAST",   # FastAPI-specific rules (see below)
    "ARG001", # unused arguments in functions
    "C4",     # flake8-comprehensions
    "RUF",
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ecomm"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.14"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=ecomm --cov-report=term-missing"

[tool.coverage.run]
source = ["src/ecomm"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover"]
fail_under = 0  # update later

[tool.uv.build-backend]
module-name = "ecomm"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"


[tool.alembic]
script_location = "%(here)s/migrations"

file_template = "%%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s"

prepend_sys_path = [
    "."
]

truncate_slug_length = 40

[[tool.alembic.post_write_hooks]]
name = "ruff-lint"
type = "exec"
executable = "uv"
options = "run ruff check --fix REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff-format"
type = "exec"
executable = "uv"
options = "run ruff format REVISION_SCRIPT_FILENAME"
